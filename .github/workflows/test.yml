name: Tests v0.2

on:
  push:
    branches: [v0.2-mvp]
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: "Lien TikTok à tester"
        default: "https://www.tiktok.com/@scout2015/video/6718335390845095173"
      llm_model:
        description: "Modèle Ollama"
        default: "qwen2.5:1.5b-instruct"
      whisper_model:
        description: "Modèle Whisper"
        default: "small"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Tests automatisés
        run: python -m pytest -q

  pipeline:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_MODEL: ${{ inputs.llm_model || 'qwen2.5:1.5b-instruct' }}
      WHISPER_MODEL: ${{ inputs.whisper_model || 'small' }}
      TIKTOK_URL: ${{ inputs.tiktok_url || 'https://www.tiktok.com/@scout2015/video/6718335390845095173' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Dépendances système
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: pip install -r requirements.txt
      - name: LLM local (Ollama)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          sleep 5
          ollama pull "$LLM_MODEL"
      - name: Démarrage de l'application
        run: |
          cp .env.example .env
          nohup bash scripts/start.sh > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8001/health
          curl -sf http://127.0.0.1:8000/ | grep -q "Video Intelligence" && echo "Interface web OK"
      - name: Pipeline complet — fichier importé (voix de synthèse FR)
        run: |
          espeak-ng -v fr -s 140 -w speech.wav "Bonjour. Le béton fibré réduit fortement la fissuration des dallages, selon une étude publiée en 2021. À mon avis, c'est la meilleure solution du marché algérien, et tous les entrepreneurs devraient l'utiliser dès maintenant."
          ffmpeg -y -loglevel error -i speech.wav speech.mp4
          python scripts/e2e_check.py file speech.mp4
      - name: Pipeline complet — lien TikTok
        continue-on-error: true
        run: python scripts/e2e_check.py url "$TIKTOK_URL"
      - name: Journaux
        if: always()
        run: |
          echo "=== app.log ==="; tail -n 60 app.log || true
          echo "=== fetcher.log ==="; tail -n 60 data/fetcher.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats
          path: |
            data/export-*.md
            app.log
            data/fetcher.log
